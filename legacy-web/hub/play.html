<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对局 · 六道小世界</title>
    <link rel="preconnect" href="https://fonts.googleapis.cn">
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="https://fonts.googleapis.cn/css2?family=Orbitron:wght@400;500;700&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #070708; overflow: hidden; }
        body { font-family: "Noto Serif SC", serif; }

        /* 顶部悬浮返回条（半透明，不遮挡棋盘） */
        #play-rail {
            position: fixed; top: 0; left: 0; right: 0; z-index: 999;
            height: 46px;
            display: flex; align-items: center; gap: 16px;
            padding: 0 16px;
            background: linear-gradient(180deg, rgba(7,7,8,0.9), rgba(7,7,8,0.55) 70%, transparent);
            pointer-events: none;
        }
        #play-rail .rail-body {
            pointer-events: auto;
            display: flex; align-items: center; gap: 10px;
        }
        #btn-back-map {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 16px;
            border: 1px solid rgba(212,175,55,0.45);
            border-radius: 6px;
            background: rgba(18,18,22,0.72);
            color: #d4af37;
            font-family: "Noto Serif SC", serif;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }
        #btn-back-map:hover { background: #d4af37; color: #070708; }
        #play-title {
            font-family: "Orbitron", monospace;
            font-size: 11px;
            letter-spacing: 0.18em;
            color: rgba(230,225,215,0.75);
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* 对局 iframe：无边框全屏（顶部留 46px 给返回条） */
        #game-frame {
            position: fixed; top: 46px; left: 0; right: 0; bottom: 0;
            width: 100%; height: calc(100% - 46px);
            border: 0;
            background: #070708;
        }
    </style>
</head>
<body>
    <div id="play-rail">
        <div class="rail-body">
            <a id="btn-back-map" href="#">← 返回地图</a>
            <span id="play-title">对局中</span>
        </div>
    </div>

    <iframe id="game-frame" title="对局" allowfullscreen></iframe>

    <script src="/static/play.js"></script>
</body>
</html>
