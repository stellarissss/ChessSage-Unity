<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>html { zoom: 0.75; }</style>
    <title>结局 · 六道轮回</title>
    <link href="https://fonts.googleapis.cn/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: rgba(20, 20, 30, 0.85);
            --text-main: #e0e0e8;
            --text-dim: #8888a0;
            --accent-gold: #d4af37;
            --accent-red: #c0392b;
            --accent-blue: #4a90d9;
        }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Noto Serif SC', serif; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .ending-scene { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; background-size: cover; background-position: center; }
        .ending-scene::before { content: ''; position: absolute; inset: 0; background: rgba(10,10,15,0.85); }
        .ending-cg-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .ending-scene::after { content: ''; position: absolute; inset: 0; background: rgba(10,10,15,0.78); z-index: 1; }
        .ending-content { position: relative; z-index: 2; max-width: 800px; width: 100%; text-align: center; }
        .ending-type { font-size: 14px; color: var(--text-dim); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 8px; }
        .ending-name { font-family: 'Ma Shan Zheng', serif; font-size: 48px; color: var(--accent-gold); margin: 0 0 20px; text-shadow: 0 0 30px rgba(212,175,55,0.4); }
        .ending-name.worst { color: var(--accent-red); text-shadow: 0 0 30px rgba(192,57,43,0.4); }
        .ending-name.true { color: #fff; text-shadow: 0 0 40px rgba(255,255,255,0.6); }
        .ending-description { font-size: 16px; line-height: 1.8; color: var(--text-main); margin: 20px 0; padding: 20px; background: var(--bg-card); border-radius: 12px; border: 1px solid rgba(212,175,55,0.2); }
        .ending-dialogues { text-align: left; margin: 30px 0; max-height: 50vh; overflow-y: auto; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 12px; }
        .ending-dialogue { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .ending-dialogue:last-child { border-bottom: none; }
        .ending-speaker { font-family: 'Ma Shan Zheng', serif; color: var(--accent-gold); font-size: 16px; }
        .ending-text { font-size: 15px; line-height: 1.8; margin-top: 6px; }
        .ending-epilogue { font-style: italic; color: var(--text-dim); font-size: 14px; margin-top: 30px; padding: 16px; border-top: 1px solid rgba(212,175,55,0.2); }
        .ending-actions { margin-top: 30px; display: flex; gap: 16px; justify-content: center; }
        .ending-btn { padding: 10px 30px; border-radius: 6px; text-decoration: none; font-size: 14px; transition: all 0.2s; border: 1px solid var(--accent-gold); color: var(--accent-gold); background: transparent; cursor: pointer; font-family: inherit; }
        .ending-btn:hover { background: var(--accent-gold); color: var(--bg-dark); }
        .ending-btn.primary { background: var(--accent-gold); color: var(--bg-dark); }
        .endings-list { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
        .ending-badge { padding: 6px 14px; border-radius: 4px; font-size: 12px; border: 1px solid; }
        .ending-badge.unlocked { border-color: var(--accent-gold); color: var(--accent-gold); background: rgba(212,175,55,0.1); }
        .ending-badge.locked { border-color: rgba(255,255,255,0.1); color: var(--text-dim); }
    </style>
</head>
<body>
    <div class="ending-scene" id="ending-scene">
        <video class="ending-cg-video" id="ending-cg-video" autoplay muted loop playsinline preload="auto"></video>
        <div class="ending-content" id="ending-content">
            <div class="ending-type" id="ending-type">加载中</div>
            <h1 class="ending-name" id="ending-name">...</h1>
            <div class="ending-description" id="ending-description"></div>
            <div class="ending-dialogues" id="ending-dialogues"></div>
            <div class="ending-epilogue" id="ending-epilogue"></div>
            <div class="endings-list" id="endings-list"></div>
            <div class="ending-actions">
                <a href="/hub" class="ending-btn primary">返回总坛</a>
                <button class="ending-btn" id="replay-btn">重新游玩</button>
            </div>
        </div>
    </div>
    <script src="/static/ending.js"></script>
</body>
</html>
